{% extends "base.html" %}

{% block meta %}
    <title>Add Skill - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <h1 class="section-title">Add New Skill</h1>

                <form method="post"
                      action="{% url 'main:create_skill' %}"
                      class="skill-form">

                    {% csrf_token %}

                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}

                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <a href="{% url 'main:create_skill' %}" class="button skills-add-button">
                        Tambah Skill
                    </a>

                    <a href="{% url 'main:show_skills' %}"
                       class="button button-secondary">
                        Batal
                    </a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
