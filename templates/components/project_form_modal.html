<div id="add-project-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-project-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-project-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah project"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-project-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah project">×</button>
        <h2 id="add-project-modal-title">Tambah Project Baru</h2>

        <form id="project-form"
              method="post"
              action="{% url 'api:project-list' %}"
              class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <div class="form-error" id="project-{{ field.name }}-error"></div>
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-project-modal"
                        popovertargetaction="hide">Batal</button>
                <button id="project-submit-button" type="submit" class="button">
                    Tambah Project
                </button>
            </div>
        </form>
    </div>
</div>
