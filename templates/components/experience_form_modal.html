<div id="add-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="experience-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah experience"></button>

    <div class="project-form-modal__content">

        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah experience">×</button>

        <h2 id="experience-modal-title">Tambah Experience Baru</h2>

        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience_ajax' %}"
              class="project-form">

            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <div class="form-error" id="experience-{{ field.name }}-error">
                        {% for error in field.errors %}{{ error }}{% endfor %}
                    </div>
                </div>
            {% endfor %}

            <div class="project-form-modal__actions">

                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">
                    Batal
                </button>

                <button id="experience-submit-button" type="submit" class="button">
                    Tambah Experience
                </button>

            </div>
        </form>
    </div>
</div>
