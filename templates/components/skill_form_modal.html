<div id="add-skill-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-skill-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah skill"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-skill-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah skill">×</button>

        <h2 id="add-skill-modal-title">Tambah Skill Baru</h2>

        <form id="skill-form"
              method="post"
              action="{% url 'api:skill-list' %}"
              class="skill-form">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <div class="form-error" id="{{ field.name }}-error"></div>
                </div>
            {% endfor %}

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-skill-modal"
                        popovertargetaction="hide">Batal</button>
                <button id="skill-submit-button" type="submit" class="button">
                    Tambah Skill
                </button>
            </div>
        </form>
    </div>
</div>
