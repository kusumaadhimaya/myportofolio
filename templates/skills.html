<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills - {{ name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_skills' %}">Skills</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="skills-section" id="skills">
            <div class="container">
                <h1 class="section-title">Skills</h1>

                <div class="skills-grid">
                {% for skill in skills_list %}
                <article class="skill-card">
                    <h2>{{ skill.title }}</h2>
                    <p class="skill-desc">
                        {{ skill.description }}
                    </p>
                    {% if skill.tags %}
                    <span class="skill-tag">
                        {{ skill.tags }}
                    </span>
                    {% endif %}
                </article>
                {% empty %}
                <p class="empty-state">
                    Belum ada skill yang ditambahkan.
                </p>
                {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
